name: Pionex Auto Trader

on:
  schedule:
    - cron: '*/15 * * * *'  # हर 15 मिनट पर स्क्रिप्ट ऑटोमैटिक चलेगी
  workflow_dispatch:        # इससे आप GitHub से कभी भी मैन्युअल बटन दबाकर चला सकते हैं

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pionex_python

      - name: Run Trading Script
        env:
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_SECRET_KEY: ${{ secrets.PIONEX_SECRET_KEY }}
        run: |
          python main.py
          
